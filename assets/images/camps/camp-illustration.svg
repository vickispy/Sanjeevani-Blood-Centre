<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 380" width="100%" height="100%">
  <defs>
    <linearGradient id="campGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F8FAFC"/>
      <stop offset="100%" stop-color="#EFF6FF"/>
    </linearGradient>
    <filter id="campShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-opacity="0.1"/>
    </filter>
  </defs>
  <rect width="100%" height="100%" rx="20" fill="url(#campGrad)"/>
  
  <!-- Camp Stage / Setup Simulation -->
  <g transform="translate(40, 40)" filter="url(#campShadow)">
    <rect width="460" height="300" rx="16" fill="#FFFFFF"/>
    
    <!-- Camp Header Banner -->
    <rect x="0" y="0" width="460" height="70" rx="16 16 0 0" fill="#16284F"/>
    <text x="30" y="36" font-family="'Plus Jakarta Sans', sans-serif" font-size="16" font-weight="bold" fill="#FFFFFF">Corporate &amp; Community Blood Drive</text>
    <text x="30" y="54" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" fill="#94A3B8">End-to-End Planning • Certified Medical Team • Zero Disruption</text>

    <!-- 4 Setup Pillars -->
    <!-- Pillar 1: Pre-Registration -->
    <g transform="translate(24, 95)">
      <rect width="96" height="175" rx="10" fill="#F8FAFC" stroke="#E2E8F0"/>
      <circle cx="48" cy="36" r="18" fill="#FFF1F3"/>
      <text x="48" y="42" font-family="'Plus Jakarta Sans', sans-serif" font-size="14" font-weight="bold" fill="#A8132B" text-anchor="middle">1</text>
      <text x="48" y="80" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="bold" fill="#1E293B" text-anchor="middle">Planning</text>
      <text x="48" y="100" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" fill="#64748B" text-anchor="middle">Date &amp; Venue</text>
      <text x="48" y="115" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" fill="#64748B" text-anchor="middle">Feasibility</text>
      <text x="48" y="130" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" fill="#64748B" text-anchor="middle">Coordination</text>
    </g>

    <!-- Pillar 2: Awareness & Donor Info -->
    <g transform="translate(132, 95)">
      <rect width="96" height="175" rx="10" fill="#F8FAFC" stroke="#E2E8F0"/>
      <circle cx="48" cy="36" r="18" fill="#EFF6FF"/>
      <text x="48" y="42" font-family="'Plus Jakarta Sans', sans-serif" font-size="14" font-weight="bold" fill="#1D4ED8" text-anchor="middle">2</text>
      <text x="48" y="80" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="bold" fill="#1E293B" text-anchor="middle">Awareness</text>
      <text x="48" y="100" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" fill="#64748B" text-anchor="middle">Internal Mailers</text>
      <text x="48" y="115" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" fill="#64748B" text-anchor="middle">Eligibility Tips</text>
      <text x="48" y="130" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" fill="#64748B" text-anchor="middle">Sign-up Lists</text>
    </g>

    <!-- Pillar 3: On-Site Setup -->
    <g transform="translate(240, 95)">
      <rect width="96" height="175" rx="10" fill="#F8FAFC" stroke="#E2E8F0"/>
      <circle cx="48" cy="36" r="18" fill="#F0FDF4"/>
      <text x="48" y="42" font-family="'Plus Jakarta Sans', sans-serif" font-size="14" font-weight="bold" fill="#15803D" text-anchor="middle">3</text>
      <text x="48" y="80" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="bold" fill="#1E293B" text-anchor="middle">Execution</text>
      <text x="48" y="100" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" fill="#64748B" text-anchor="middle">Beds &amp; Kits</text>
      <text x="48" y="115" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" fill="#64748B" text-anchor="middle">Doctors on-site</text>
      <text x="48" y="130" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" fill="#64748B" text-anchor="middle">Strict Hygiene</text>
    </g>

    <!-- Pillar 4: Donor Appreciation -->
    <g transform="translate(348, 95)">
      <rect width="96" height="175" rx="10" fill="#F8FAFC" stroke="#E2E8F0"/>
      <circle cx="48" cy="36" r="18" fill="#FEF3C7"/>
      <text x="48" y="42" font-family="'Plus Jakarta Sans', sans-serif" font-size="14" font-weight="bold" fill="#B45309" text-anchor="middle">4</text>
      <text x="48" y="80" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="bold" fill="#1E293B" text-anchor="middle">Care &amp; Certs</text>
      <text x="48" y="100" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" fill="#64748B" text-anchor="middle">Refreshments</text>
      <text x="48" y="115" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" fill="#64748B" text-anchor="middle">Donor Cards</text>
      <text x="48" y="130" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" fill="#64748B" text-anchor="middle">Organisation Cert</text>
    </g>
  </g>
</svg>
