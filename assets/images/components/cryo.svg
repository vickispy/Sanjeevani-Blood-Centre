<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 240" width="100%" height="100%">
  <defs>
    <linearGradient id="cryoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#BAE6FD"/>
      <stop offset="100%" stop-color="#0284C7"/>
    </linearGradient>
    <filter id="shadowCryo" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-opacity="0.12"/>
    </filter>
  </defs>
  <rect width="100%" height="100%" rx="16" fill="#F0F9FF"/>
  <g transform="translate(100, 25)" filter="url(#shadowCryo)">
    <rect x="0" y="20" width="120" height="170" rx="20" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="2"/>
    <!-- Concentrated Cold-Insoluble Plasma Layer -->
    <path d="M 0 110 Q 30 105, 60 110 T 120 110 L 120 170 Q 120 190, 100 190 L 20 190 Q 0 190, 0 170 Z" fill="url(#cryoGrad)"/>
    <rect x="45" y="10" width="30" height="15" rx="3" fill="#E2E8F0"/>
    <circle cx="60" cy="5" r="4" fill="#0284C7"/>
    <rect x="15" y="40" width="90" height="50" rx="6" fill="#FFFFFF" opacity="0.95"/>
    <text x="60" y="58" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="bold" fill="#0369A1" text-anchor="middle">Cryoprecipitate (CRYO)</text>
    <text x="60" y="72" font-family="'Plus Jakarta Sans', sans-serif" font-size="8" fill="#64748B" text-anchor="middle">Store: &#8804; -30&#176;C</text>
    <text x="60" y="82" font-family="'Plus Jakarta Sans', sans-serif" font-size="8" fill="#64748B" text-anchor="middle">Factor VIII &amp; Fibrinogen</text>
  </g>
  <!-- Crystal / Frost accents -->
  <circle cx="45" cy="160" r="8" fill="#0284C7" opacity="0.2"/>
  <circle cx="270" cy="70" r="16" fill="#0284C7" opacity="0.15"/>
</svg>
