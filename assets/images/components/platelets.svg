<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 240" width="100%" height="100%">
  <defs>
    <linearGradient id="pltGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FEF08A"/>
      <stop offset="100%" stop-color="#EAB308"/>
    </linearGradient>
    <filter id="shadowPlt" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-opacity="0.1"/>
    </filter>
  </defs>
  <rect width="100%" height="100%" rx="16" fill="#FFFBEB"/>
  <g transform="translate(100, 25)" filter="url(#shadowPlt)">
    <rect x="0" y="20" width="120" height="170" rx="20" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="2"/>
    <path d="M 0 80 Q 30 75, 60 80 T 120 80 L 120 170 Q 120 190, 100 190 L 20 190 Q 0 190, 0 170 Z" fill="url(#pltGrad)"/>
    <rect x="45" y="10" width="30" height="15" rx="3" fill="#E2E8F0"/>
    <circle cx="60" cy="5" r="4" fill="#EAB308"/>
    <rect x="15" y="40" width="90" height="50" rx="6" fill="#FFFFFF" opacity="0.95"/>
    <text x="60" y="58" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="bold" fill="#B45309" text-anchor="middle">Platelets (RDP / SDP)</text>
    <text x="60" y="72" font-family="'Plus Jakarta Sans', sans-serif" font-size="8" fill="#64748B" text-anchor="middle">Store: 20°C - 24°C Agitated</text>
    <text x="60" y="82" font-family="'Plus Jakarta Sans', sans-serif" font-size="8" fill="#64748B" text-anchor="middle">Shelf-life: 5 Days</text>
  </g>
  <!-- Platelet Microdots / Swirl accents -->
  <circle cx="50" cy="150" r="4" fill="#F59E0B" opacity="0.4"/>
  <circle cx="65" cy="130" r="3" fill="#F59E0B" opacity="0.3"/>
  <circle cx="260" cy="80" r="5" fill="#F59E0B" opacity="0.4"/>
  <circle cx="275" cy="95" r="3" fill="#F59E0B" opacity="0.3"/>
</svg>
