<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 240" width="100%" height="100%">
  <defs>
    <linearGradient id="prbcGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#C51936"/>
      <stop offset="100%" stop-color="#7A0D1E"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-opacity="0.15"/>
    </filter>
  </defs>
  <rect width="100%" height="100%" rx="16" fill="#FFF5F5"/>
  <!-- Blood Pack Outer -->
  <g transform="translate(100, 25)" filter="url(#shadow)">
    <rect x="0" y="20" width="120" height="170" rx="20" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="2"/>
    <!-- Red Fluid -->
    <path d="M 0 70 Q 30 65, 60 70 T 120 70 L 120 170 Q 120 190, 100 190 L 20 190 Q 0 190, 0 170 Z" fill="url(#prbcGrad)"/>
    <!-- Pack Header Port -->
    <rect x="45" y="10" width="30" height="15" rx="3" fill="#E2E8F0"/>
    <circle cx="60" cy="5" r="4" fill="#A8132B"/>
    <!-- Medical Label -->
    <rect x="15" y="40" width="90" height="50" rx="6" fill="#FFFFFF" opacity="0.95"/>
    <text x="60" y="58" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="bold" fill="#A8132B" text-anchor="middle">PRBC (Red Cells)</text>
    <text x="60" y="72" font-family="'Plus Jakarta Sans', sans-serif" font-size="8" fill="#64748B" text-anchor="middle">Store: 2°C to 6°C</text>
    <text x="60" y="82" font-family="'Plus Jakarta Sans', sans-serif" font-size="8" fill="#64748B" text-anchor="middle">Shelf-life: up to 42 Days</text>
  </g>
  <!-- RBC Disc Icon Accents -->
  <circle cx="45" cy="80" r="16" fill="#C51936" opacity="0.18"/>
  <circle cx="45" cy="80" r="8" fill="#A8132B" opacity="0.25"/>
  <circle cx="270" cy="160" r="22" fill="#C51936" opacity="0.15"/>
  <circle cx="270" cy="160" r="11" fill="#A8132B" opacity="0.2"/>
</svg>
