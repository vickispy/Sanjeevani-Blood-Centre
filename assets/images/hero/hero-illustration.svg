<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF1F3"/>
      <stop offset="100%" stop-color="#F0F4FA"/>
    </linearGradient>
    <linearGradient id="crimsonMain" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#C51936"/>
      <stop offset="100%" stop-color="#7A0D1E"/>
    </linearGradient>
    <linearGradient id="navyMain" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#203A70"/>
      <stop offset="100%" stop-color="#16284F"/>
    </linearGradient>
    <filter id="cardShadow" x="-10%" y="-10%" width="125%" height="125%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-opacity="0.12"/>
    </filter>
  </defs>

  <rect width="100%" height="100%" rx="24" fill="url(#bgGlow)"/>

  <!-- Subtle Circular Medical Network Background -->
  <circle cx="300" cy="225" r="180" fill="none" stroke="#E2E8F0" stroke-width="1.5" stroke-dasharray="4 4"/>
  <circle cx="300" cy="225" r="130" fill="none" stroke="#E2E8F0" stroke-width="1.5"/>

  <!-- Left Card: Clinical Safety & Compassion -->
  <g transform="translate(60, 80)" filter="url(#cardShadow)">
    <rect width="210" height="260" rx="18" fill="#FFFFFF"/>
    <!-- Card Header -->
    <rect x="20" y="24" width="44" height="44" rx="10" fill="#FFF1F3"/>
    <path d="M42 36 C42 44 34 50 34 50 C34 50 26 44 26 36 C26 31 30 28 34 31 C38 28 42 31 42 36 Z" fill="#A8132B"/>
    <text x="76" y="44" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" font-weight="bold" fill="#16284F">Voluntary Donor</text>
    <text x="76" y="58" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" fill="#64748B">Safety &amp; Comfort</text>

    <!-- Stat Bar -->
    <rect x="20" y="90" width="170" height="8" rx="4" fill="#F1F5F9"/>
    <rect x="20" y="90" width="145" height="8" rx="4" fill="#A8132B"/>

    <!-- Step Visuals -->
    <rect x="20" y="120" width="170" height="42" rx="8" fill="#F8FAFC"/>
    <circle cx="38" cy="141" r="10" fill="#DCFCE7"/>
    <path d="M34 141 L37 144 L43 138" stroke="#166534" stroke-width="2" fill="none" stroke-linecap="round"/>
    <text x="56" y="139" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="600" fill="#1E293B">Sterile Single-Use Kits</text>
    <text x="56" y="151" font-family="'Plus Jakarta Sans', sans-serif" font-size="8" fill="#64748B">Zero Compromise Protocols</text>

    <rect x="20" y="174" width="170" height="42" rx="8" fill="#F8FAFC"/>
    <circle cx="38" cy="195" r="10" fill="#EFF6FF"/>
    <path d="M38 189 V201 M32 195 H44" stroke="#1D4ED8" stroke-width="2" stroke-linecap="round"/>
    <text x="56" y="193" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="600" fill="#1E293B">Hemoglobin Checked</text>
    <text x="56" y="205" font-family="'Plus Jakarta Sans', sans-serif" font-size="8" fill="#64748B">Pre-donation Health Check</text>
  </g>

  <!-- Right Floating Card: Thalassemia & Patient Impact -->
  <g transform="translate(320, 110)" filter="url(#cardShadow)">
    <rect width="220" height="240" rx="18" fill="url(#navyMain)"/>
    
    <text x="24" y="44" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="bold" fill="#FFC0C7" letter-spacing="1">FREE BLOOD INITIATIVE</text>
    <text x="24" y="80" font-family="'Playfair Display', serif" font-size="32" font-weight="bold" fill="#FFFFFF">200+ Units</text>
    <text x="24" y="104" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" fill="#CBD5E1">Monthly Free Support</text>

    <line x1="24" y1="126" x2="196" y2="126" stroke="rgba(255,255,255,0.15)" stroke-width="1"/>

    <text x="24" y="154" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="600" fill="#FFFFFF">Serving Patients With:</text>
    
    <rect x="24" y="168" width="172" height="26" rx="6" fill="rgba(255,255,255,0.1)"/>
    <text x="34" y="185" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" fill="#E2E8F0">&#8226; Thalassemia Care</text>

    <rect x="24" y="200" width="172" height="26" rx="6" fill="rgba(255,255,255,0.1)"/>
    <text x="34" y="217" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" fill="#E2E8F0">&#8226; Sickle Cell Anaemia</text>
  </g>

  <!-- Central Dynamic Connecting Droplet -->
  <circle cx="300" cy="225" r="26" fill="url(#crimsonMain)" filter="url(#cardShadow)"/>
  <path d="M300 209 C298 213 288 227 288 232 C288 238 293 243 300 243 C307 243 312 238 312 232 C312 227 302 213 300 209 Z" fill="#FFFFFF"/>
</svg>
